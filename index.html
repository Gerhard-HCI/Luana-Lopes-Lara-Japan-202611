<!DOCTYPE html>
<html lang="en" style="background-color:#131e36">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#131e36">
  <title>Happy Camper · Private Itinerary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;min-height:100%;background-color:#131e36}
    body{font-family:'Jost','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#FFFFFF;-webkit-font-smoothing:antialiased;
      background-color:#131e36;background-image:linear-gradient(160deg,#131e36 0%,#1a2848 100%);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center}
    .gate{width:100%;max-width:400px;padding:40px 24px calc(40px + env(safe-area-inset-bottom));box-sizing:border-box;text-align:center;background-color:transparent}
    .gate-badge{width:230px;height:230px;border-radius:50%;background-color:transparent;background-image:radial-gradient(closest-side,#FFFFFF 0%,#FFFFFF 56%,rgba(255,255,255,0.75) 66%,rgba(255,255,255,0.35) 80%,rgba(255,255,255,0.1) 91%,rgba(255,255,255,0) 100%);margin:-30px auto -12px;display:flex;align-items:center;justify-content:center}
    .gate-logo{width:120px;height:auto;display:block;mix-blend-mode:multiply}
    .gate-kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#E79AAE;margin-bottom:10px}
    .gate-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;font-weight:600;line-height:1.1;margin:0 0 10px;color:#FFFFFF}
    .gate-sub{font-size:14px;line-height:1.6;color:#C9D0E0;margin:0 0 28px}
    .gate-card{background-color:#1F2C4F;border:1px solid #2E3D66;border-radius:20px;padding:22px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
    .gate-label{display:block;text-align:left;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#AEB8D0;margin:0 0 8px 2px}
    .gate-row{position:relative}
    .gate-input{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:15px 52px 15px 16px;border-radius:12px;border:1.5px solid #3A4A78!important;background-color:#FFFFFF!important;color:#131e36!important;outline:none;-webkit-appearance:none;appearance:none}
    .gate-input:focus{border-color:#c8627c!important}
    .gate-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;background-color:transparent!important;font-size:18px;cursor:pointer;color:#55607A}
    .gate-check{display:flex;align-items:center;gap:10px;margin:14px 2px 0;font-size:13px;color:#C9D0E0;text-align:left;cursor:pointer}
    .gate-check input{width:20px;height:20px;accent-color:#c8627c;margin:0}
    .gate-btn{width:100%;margin-top:18px;font:inherit;font-size:16px;font-weight:600;letter-spacing:.04em;padding:15px;border:none;border-radius:12px;
      background-color:#c8627c!important;color:#FFFFFF!important;cursor:pointer;-webkit-appearance:none;appearance:none;min-height:52px}
    .gate-btn[disabled]{background-color:#8E4A5E!important;cursor:default}
    .gate-err{min-height:20px;margin-top:12px;font-size:13px;color:#FFB3C3}
    .gate-foot{margin-top:28px;font-size:12px;line-height:1.7;color:#8C97B3}
    .gate-foot a{color:#E79AAE;text-decoration:none}
    .shake{animation:shake .35s}
    @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    @media (prefers-reduced-motion:reduce){.shake{animation:none}}
  </style>
</head>

  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function toB64(buf){ var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  function deriveKey(pass){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(base){
